name: Deploy Frontend no GitHub Pages

on:
  push:
    branches: ['feat/githubpages'] # 👈 Coloque aqui o NOME Exato da sua branch nova!

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json' # Ajuste o caminho se seu package-lock estiver em outro lugar

      - name: Instalar dependências e Compilar
        working-directory: ./frontend # Pasta onde está o React
        run: |
          npm ci
          npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v4

      - name: Upload do artefato buildado
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4